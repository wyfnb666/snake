<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f4efe4">
<title>贪吃蛇 · 单页小游戏</title>
<style>
  :root {
    --paper: #f4efe4;
    --paper-2: #ebe3d3;
    --paper-3: #f7f2e7;
    --ink: #1b1917;
    --ink-2: #57503f;
    --ink-3: #8c8371;
    --rule: #cdc2ac;
    --accent: #b8432f;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    --serif: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 34px 20px 46px;
    position: relative;
  }

  /* 极淡的方格纸底纹，代替原来的径向渐变光晕 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 30px 30px;
    opacity: .13;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; max-width: 990px; margin: 0 auto; }

  /* ---------- 报头 ---------- */
  .masthead {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 12px;
    margin-bottom: 26px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }

  .masthead h1 {
    font-family: var(--serif);
    font-size: 34px;
    font-weight: 600;
    letter-spacing: .18em;
    margin: 0;
    line-height: 1;
  }

  .masthead .dek {
    margin: 0;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--ink-2);
    padding-bottom: 3px;
  }

  /* ---------- 布局 ---------- */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 252px;
    gap: 30px;
    align-items: start;
  }

  /* ---------- 棋盘（机身） ---------- */
  .console {
    border: 2px solid var(--ink);
    background: var(--paper-2);
    box-shadow: 7px 7px 0 var(--ink);
  }

  .device {
    padding: 10px;
    position: relative;
  }

  #game {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--ink);
    background: var(--paper-3);
    touch-action: manipulation;
    cursor: pointer;
  }

  /* ---------- 计分板 ---------- */
  .ledger {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 2px solid var(--ink);
    background: var(--paper);
  }

  .ledger .cell {
    padding: 9px 12px 8px;
    border-left: 1px solid var(--rule);
  }

  .ledger .cell:first-child { border-left: 0; }

  .ledger .cell span {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 2px;
  }

  .ledger .cell .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 5px;
    border: 1px solid var(--ink);
    vertical-align: 1px;
  }

  .ledger .cell b {
    font-family: var(--mono);
    font-size: 21px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 右侧栏 ---------- */
  .side { display: flex; flex-direction: column; gap: 22px; }

  .block h2 {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--ink-2);
    margin: 0 0 8px;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--rule);
  }

  /* 速度 / 模式 / 围墙选择 */
  .segs { display: flex; border: 1px solid var(--ink); }

  .seg {
    flex: 1 1 0;
    appearance: none;
    border: 0;
    border-left: 1px solid var(--ink);
    background: transparent;
    color: var(--ink-2);
    font: inherit;
    font-size: 13px;
    padding: 8px 0;
    cursor: pointer;
    transition: background .1s, color .1s;
  }

  .seg:first-child { border-left: 0; }
  .seg:hover { background: var(--paper-2); color: var(--ink); }

  .seg.active {
    background: var(--ink);
    color: var(--paper);
    font-weight: 600;
  }

  /* 方向键 */
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 46px);
    gap: 3px;
  }

  .pad {
    appearance: none;
    border: 1px solid var(--ink);
    background: var(--paper-3);
    color: var(--ink-2);
    font-size: 13px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background .1s, color .1s, transform .05s;
  }

  .pad:hover { background: var(--paper-2); color: var(--ink); }
  .pad:active { background: var(--ink); color: var(--paper); transform: translate(1px, 1px); }

  .pad.up    { grid-area: 1 / 2; }
  .pad.left  { grid-area: 2 / 1; }
  .pad.down  { grid-area: 3 / 2; }
  .pad.right { grid-area: 2 / 3; }

  /* 穿墙开关 */
  .btn {
    appearance: none;
    border: 1px solid var(--ink);
    background: var(--paper-3);
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
    padding: 9px 10px;
    cursor: pointer;
    text-align: center;
    transition: background .1s, color .1s;
  }

  .btn:hover { background: var(--ink); color: var(--paper); }

  .btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--paper);
    font-weight: 600;
  }

  /* 按键说明 */
  .keys { margin: 0; font-family: var(--mono); font-size: 11px; line-height: 1.9; color: var(--ink-2); }
  .keys dt { float: left; clear: left; width: 62px; color: var(--ink-3); }
  .keys dd { margin: 0 0 0 62px; }

  .colophon {
    margin-top: 26px;
    padding-top: 10px;
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .04em;
    color: var(--ink-3);
    display: flex;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }

  /* ---------- 遮罩 ---------- */
  .overlay {
    position: absolute;
    inset: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background: rgba(244, 239, 228, .95);
    border: 1px solid var(--ink);
    transition: opacity .15s;
    z-index: 3;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .card { text-align: center; max-width: 300px; width: 100%; }

  .kicker {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 12px;
  }

  .card h2 {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 600;
    letter-spacing: .12em;
    margin: 0 0 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--rule);
  }

  .card .sub {
    margin: 0 0 14px;
    font-size: 12.5px;
    line-height: 1.8;
    color: var(--ink-2);
  }

  .rows {
    border-top: 1px solid var(--ink);
    border-bottom: 1px solid var(--ink);
    margin-bottom: 16px;
    text-align: left;
  }

  .rows > div {
    display: flex;
    justify-content: space-between;
    padding: 6px 2px;
    font-size: 13px;
  }

  .rows > div + div { border-top: 1px dotted var(--rule); }
  .rows span { color: var(--ink-2); }
  .rows b { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .rows b.gold { color: var(--accent); }

  .btn.primary {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
    font-weight: 600;
    letter-spacing: .08em;
    padding: 9px 22px;
  }

  .btn.primary:hover { background: var(--accent); border-color: var(--accent); }

  .muted { color: var(--ink-3); font-size: 12px; }

  .spin {
    width: 20px; height: 20px;
    margin: 0 auto 12px;
    border: 1px solid var(--rule);
    border-top-color: var(--ink);
    animation: spin .8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 窄屏 ---------- */
  @media (max-width: 820px) {
    body { padding: 22px 14px 32px; }
    .layout { grid-template-columns: 1fr; gap: 24px; }
    .masthead h1 { font-size: 27px; letter-spacing: .12em; }
    .side { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 20px; }
    .side .block:first-child { grid-column: 1 / -1; }
    .dpad { grid-template-rows: repeat(3, 44px); }
  }

  @media (max-width: 460px) {
    .side { grid-template-columns: 1fr; }
    .ledger .cell b { font-size: 18px; }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="masthead">
      <h1>贪吃蛇</h1>
      <p class="dek">Snake · No.01</p>
    </header>

    <div class="layout">
      <main>
        <div class="console">
          <div class="device">
            <canvas id="game" width="480" height="480"></canvas>
            <div class="overlay hidden" id="overlay">
              <div id="overlayInner"></div>
            </div>
          </div>

          <div class="ledger" id="ledger"></div>
        </div>
      </main>

      <aside class="side">
        <section class="block">
          <h2>模式</h2>
          <div class="segs" id="modes"></div>
        </section>

        <section class="block">
          <h2>速度</h2>
          <div class="segs" id="speeds"></div>
        </section>

        <section class="block" id="wallBlock">
          <h2>围墙时长</h2>
          <div class="segs" id="walls"></div>
        </section>

        <section class="block">
          <h2>方向</h2>
          <div class="dpad" id="dpad">
            <button class="pad up" data-dir="up" aria-label="上">▲</button>
            <button class="pad left" data-dir="left" aria-label="左">◀</button>
            <button class="pad down" data-dir="down" aria-label="下">▼</button>
            <button class="pad right" data-dir="right" aria-label="右">▶</button>
          </div>
        </section>

        <section class="block">
          <h2>规则</h2>
          <button class="btn" id="btnWrap">穿墙：关</button>
        </section>

        <section class="block">
          <h2>按键</h2>
          <dl class="keys">
            <dt>P1</dt><dd>W A S D</dd>
            <dt>P2</dt><dd>方向键</dd>
            <dt>暂停</dt><dd>空格</dd>
            <dt>重开</dt><dd>R</dd>
          </dl>
        </section>
      </aside>
    </div>

    <div class="colophon">
      <span>双人：中间有围墙（时长可调），撞墙即负；围墙打开后抢果实、躲开两条蛇</span>
      <span>单文件 · 无依赖</span>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
